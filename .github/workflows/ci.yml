# Tests and a package check on every push to main and every pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Node 20 is the lowest version package.json promises; 22 is what the runners ship.
    # macOS because most people running the CLI and its local MCP server are on one.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: ["20", "22"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out (plain git, no stored credentials)
        run: |
          set -eu
          git init -q .
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Tests
        run: |
          node --version
          node --test tests/*.test.mjs

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
    steps:
      - name: Check out (plain git, no stored credentials)
        run: |
          set -eu
          git init -q .
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax of every source file
        run: for f in bin/*.mjs src/*.mjs scripts/*.mjs; do node --check "$f"; done

      - name: What npm publish would ship
        run: node scripts/check-package.mjs

      - name: Workflows
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo "rhysd/actionlint:${ACTIONLINT_VERSION}" \
            -color .github/workflows/ci.yml
